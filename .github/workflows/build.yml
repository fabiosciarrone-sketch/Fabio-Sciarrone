name: Build Android App Bundle

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # 1. gradle.properties: via il percorso Windows del JDK (non esiste su Linux)
      - name: Clean gradle.properties
        run: |
          find . -name gradle.properties -not -path "./.git/*" | while read -r f; do
            sed -i 's/\r$//' "$f"
            sed -i '/org\.gradle\.java\.home/d' "$f"
            echo "--- $f ---"
            cat "$f"
          done
          if grep -rn "org.gradle.java.home" --include=gradle.properties . ; then
            echo "::error::org.gradle.java.home è ancora presente"
            exit 1
          fi

      # gradlew committato da Windows: fine riga CRLF e permesso di esecuzione
      - name: Fix gradlew for Linux
        run: |
          if [ -f android/gradlew ]; then
            sed -i 's/\r$//' android/gradlew
            chmod +x android/gradlew
          fi

      # 2. Firma: controlla che i secret esistano, poi ricrea keystore e key.properties
      - name: Check signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=0
          for v in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!v}" ]; then echo "::error::Secret mancante: $v"; missing=1; fi
          done
          exit $missing

      - name: Create keystore and key.properties
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > android/app/upload-keystore.jks
          {
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=upload-keystore.jks"
          } > android/key.properties
          ls -l android/app/upload-keystore.jks

      # 3. google-services.json: ricreato dal secret solo se non è già nel repository
      - name: Create google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -f android/app/google-services.json ]; then
            echo "google-services.json
