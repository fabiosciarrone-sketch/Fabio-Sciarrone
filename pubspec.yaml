name: SideBySide
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: ^3.5.4


dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^3.8.1
  firebase_auth: ^5.3.4
  cloud_firestore: ^5.5.0
  mobile_scanner: ^6.0.2
  url_launcher: ^6.3.0
  google_mobile_ads: ^5.2.0
  qr_flutter: ^4.1.0
  image_picker: ^1.1.2
  http: ^1.2.2
  geolocator: ^13.0.2
  flutter_map: ^7.0.0
  latlong2: ^0.9.0
  google_sign_in: ^6.2.1
  firebase_messaging: ^15.1.6
  flutter_local_notifications: ^18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true